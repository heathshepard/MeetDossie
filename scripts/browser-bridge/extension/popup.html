<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Cole Browser Bridge</title>
<style>
  body { width: 340px; font-family: -apple-system, Segoe UI, sans-serif; margin: 0; padding: 12px; color: #1A1A2E; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  button { border: none; border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
  #armBtn.armed { background: #8BA888; color: white; }
  #armBtn.disarmed { background: #eee; color: #333; }
  .status { font-size: 12px; color: #555; margin-bottom: 10px; line-height: 1.4; }
  .status b { color: #1A1A2E; }
  .pending { border: 1px solid #E8836B; border-radius: 6px; padding: 8px; margin-bottom: 8px; background: #FFF6F3; }
  .pending .action { font-weight: 600; font-size: 13px; }
  .pending .detail { font-size: 12px; color: #555; margin: 4px 0 8px; word-break: break-all; }
  .pending-actions { display: flex; gap: 6px; }
  .approve { background: #8BA888; color: white; flex: 1; }
  .reject { background: #E8836B; color: white; flex: 1; }
  .empty { font-size: 12px; color: #888; text-align: center; padding: 10px 0; }
  .conn { font-size: 11px; margin-top: 10px; color: #999; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .dot.connected { background: #8BA888; }
  .dot.disconnected, .dot.error { background: #E8836B; }
  .dot.connecting { background: #C9A96E; }
</style>
</head>
<body>
  <h1>Cole Browser Bridge</h1>
  <div class="status" id="status">loading...</div>
  <div class="row">
    <button id="armBtn" class="disarmed">Arm this tab</button>
  </div>
  <div id="pendingList"></div>
  <div class="conn" id="conn"><span class="dot disconnected"></span>native host: checking...</div>
  <script src="popup.js"></script>
</body>
</html>
