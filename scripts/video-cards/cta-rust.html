<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!--
  Rust CTA end card. Playbook §5 item 10 / §5a check 16.

  THE OFFER LINE IS NOT EDITABLE TO A DOWNLOAD CLAIM. Rust is in neither store
  (iOS in review with manual release; Android blocked in closed testing behind
  Google's health-declaration scanner - rust-app-store-submission-state.md).
  "Not in the app stores yet" is the honest line and it stays. The compositor
  refuses any Rust card whose visible text matches /download|app store|.../ -
  see cta.forbidden in scripts/_lib/shortform-brands.json.

  {{CTA_URL}} is filled in by build-shortform-video.py's card_source() from
  brands.rust.cta.url in scripts/_lib/shortform-brands.json - that is the ONE
  place the URL is set. Never hardcode a domain in this file again: 2026-09-16,
  this card had "rustfitness.app" typed directly into the markup below, which
  meant fixing the JSON alone (to the working waitlist link, since
  rustfitness.app is NXDOMAIN) would not have changed what actually rendered.
  assert_cta_url_resolves() in build-shortform-video.py also refuses to build
  if brands.rust.cta.url stops resolving, so this can't go dead silently again.
-->
<style>
  body{background:#0D0D0F}
  .safe{justify-content:center}
  .kick{color:#8A8A8A}
  h1{color:#F2F2F2;font-size:104px}
  h1 .hl{color:#E4572E}
  .rule{background:#E4572E}
  .url{color:#F2F2F2;font-size:64px;margin-top:48px}
  .offer{font-family:'PJS';font-size:52px;color:#E4572E;margin-top:18px;letter-spacing:.02em}
  .note{font-family:'PJSR';font-size:36px;color:#9A9A9A;margin-top:34px}
</style></head><body>
<div class="safe">
  <div class="kick">Rust</div>
  <h1>Coaching that<br><span class="hl">actually adjusts</span></h1>
  <div class="rule"></div>
  <div class="url">{{CTA_URL}}</div>
  <div class="offer">{{CTA_OFFER}}</div>
  <div class="note">Not in the app stores yet</div>
</div>
</body></html>
