<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:420px;background:transparent;
 font-family:'Plus Jakarta Sans',DejaVu Sans,sans-serif}
.panel{margin:28px 40px;background:rgba(10,10,20,.93);border-radius:14px;
 padding:34px 38px 38px;display:flex;flex-direction:column;gap:20px;align-items:flex-start;
 box-shadow:0 18px 50px rgba(0,0,0,.75); border:3px solid rgba(245,197,67,.55)}
.row{display:flex;align-items:center;gap:20px}
.pill{background:#F5C543;color:#101020;font-size:50px;font-weight:800;padding:14px 28px 18px;
 border-radius:8px}
.line{font-size:52px;font-weight:800;color:#fff}
.sub{font-size:36px;font-weight:800;color:#F5C543}
</style></head><body><div class="panel">
 <div class="row"><div class="pill">FOLLOW</div><div class="line">for all 6 changes</div></div>
 <div class="sub">Save this before your next contract.</div>
</div></body></html>
