<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:640px;background:transparent;
 font-family:'Plus Jakarta Sans',DejaVu Sans,sans-serif}
.wrap{padding:0 46px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.t{background:#F5C543;color:#101020;font-size:44px;font-weight:800;padding:11px 22px 15px;
 transform:rotate(-1.4deg);box-shadow:7px 7px 0 rgba(0,0,0,.55)}
h1{font-size:104px;line-height:.97;font-weight:800;letter-spacing:-.035em;color:#fff;
 text-shadow:0 5px 22px rgba(0,0,0,.95), 0 0 60px rgba(0,0,0,.8)}
h1 .s{background:#F5C543;color:#101020;padding:0 13px 7px;display:inline-block;
 transform:rotate(-.6deg);box-shadow:6px 6px 0 rgba(0,0,0,.5);text-shadow:none;margin-top:8px}
</style></head><body><div class="wrap">
 <div class="t">TEXAS AGENTS</div>
 <h1>TWO DAYS OUT.<br><span class="s">THEY CAN STILL WALK.</span></h1>
</div></body></html>
