<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;position:relative;
 background:radial-gradient(118% 66% at 70% 64%,#2E3354 0%,#1A1A2E 46%,#0A0A14 100%);
 font-family:DejaVu Sans,sans-serif;color:#fff}
.person{position:absolute;right:-130px;bottom:-45px;height:1330px;
 filter:drop-shadow(-16px 4px 32px rgba(0,0,0,.72)) brightness(1.46) contrast(1.04) saturate(1.04)}
.glow{position:absolute;right:0px;bottom:0;width:720px;height:1240px;
 background:radial-gradient(52% 44% at 50% 40%,rgba(120,150,220,.30),rgba(0,0,0,0) 70%)}
.scrim{position:absolute;inset:0;
 background:linear-gradient(180deg,rgba(10,10,20,.97) 0%,rgba(10,10,20,.94) 42%,rgba(10,10,20,.22) 60%,rgba(10,10,20,.62) 100%)}
.col{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;
 padding:92px 52px 0 52px;gap:22px}
.tag{align-self:flex-start;background:#F5C543;color:#101020;font-size:50px;font-weight:bold;
 padding:13px 27px 17px;transform:rotate(-1.4deg);box-shadow:8px 8px 0 rgba(0,0,0,.5)}
h1{font-size:118px;line-height:.96;font-weight:bold;letter-spacing:-.04em;
 text-shadow:0 6px 26px rgba(0,0,0,.8)}
h1 .slab{background:#F5C543;color:#101020;padding:0 15px 9px;display:inline-block;
 transform:rotate(-.7deg);box-shadow:7px 7px 0 rgba(0,0,0,.42);text-shadow:none;margin:8px 0}
.sub{font-size:46px;line-height:1.2;color:#E2E7F7;font-weight:bold;max-width:880px;
 text-shadow:0 3px 16px rgba(0,0,0,.9)}
.stamp{position:absolute;left:54px;bottom:58px;font-size:36px;letter-spacing:.12em;
 color:#F5C543;font-weight:bold;text-shadow:0 3px 14px rgba(0,0,0,.95)}
</style></head><body>
  <div class="glow"></div>
  <img class="person" src="PERSON">
  <div class="scrim"></div>
  <div class="col">
    <div class="tag">TEXAS AGENTS</div>
    <h1>TWO DAYS<br>FROM CLOSING.<br><span class="slab">THEY CAN STILL WALK.</span></h1>
    <div class="sub">And take the earnest money with them.</div>
  </div>
  <div class="stamp">TREC 20-19 &nbsp;·&nbsp; ¶7.I</div>
</body></html>
